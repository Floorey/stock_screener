name: blackgate-analytics
services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/prepare.py first}
    ports:
      - "127.0.0.1:15439:5432"
    volumes:
      - analytics_pg:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 12
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../.runtime/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
volumes:
  analytics_pg:
  caddy_data:
  caddy_config:
