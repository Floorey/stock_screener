# Scrape config for the command center.
#
# The endpoint is served straight from the in-memory ring buffers, so scraping
# costs no broker rate-limit budget at any interval — the 5s below is chosen to
# match the fastest series (orderbook at 1s), not to save requests.

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: command-center

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: command_center
    metrics_path: /metrics
    static_configs:
      # Adjust when the service does not run on the Docker host. Remember that
      # the server must listen on 0.0.0.0 to be reachable from a container.
      - targets: ["host.docker.internal:8080"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
