apiVersion: 1

providers:
  - name: command-center
    orgId: 1
    folder: Command Center
    type: file
    disableDeletion: false
    # Edits made in the UI are overwritten on the next reload. Export the JSON
    # and commit it here if you want a change to survive.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
